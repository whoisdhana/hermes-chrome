<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hermes Chrome settings</title>
  <style>
    body { margin: 0; font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; background: #FBF7F2; color: #1C1917; }
    main { max-width: 560px; margin: 40px auto; padding: 0 16px; display: grid; gap: 18px; }
    h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
    h1 img { width: 36px; height: 36px; }
    h2 { margin: 8px 0 0; font-size: 15px; }
    label { display: grid; gap: 4px; font-weight: 600; }
    small { font-weight: 400; color: #57534E; }
    input[type=text], textarea, select { font: inherit; padding: 8px 10px; border: 1px solid #D6D3D1; border-radius: 8px; background: #FFF; }
    textarea { min-height: 70px; }
    .check { display: flex; gap: 8px; align-items: flex-start; font-weight: 600; }
    button { justify-self: start; font: inherit; font-weight: 700; padding: 9px 18px; border: 0; border-radius: 8px; background: #BA583D; color: #FBF1E6; cursor: pointer; }
    button.quiet { background: #F5F2EE; color: #1C1917; box-shadow: inset 0 0 0 1px #D6D3D1; font-weight: 600; }
    button.quiet:hover { background: #EEE9E3; }
    button.danger { background: transparent; color: #B42318; box-shadow: inset 0 0 0 1px #F1C4BE; font-weight: 600; }
    button.danger:hover { background: #FDF0EE; }
    button.link { background: none; color: #BA583D; padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    button:disabled { opacity: .5; cursor: default; }
    .status { display: flex; gap: 12px; align-items: flex-start; }
    .status .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; flex: none; background: #A8A29E; }
    .status.ok .dot { background: #16A34A; box-shadow: 0 0 0 4px #DCFCE7; }
    .status.wait .dot { background: #D97706; box-shadow: 0 0 0 4px #FEF3C7; }
    .status.bad .dot { background: #DC2626; box-shadow: 0 0 0 4px #FEE2E2; }
    .status b { display: block; font-size: 15px; }
    .status small { display: block; }
    .actions { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .divider { height: 1px; background: #EEEAE6; margin: 4px 0; }
    details.more { display: grid; gap: 12px; }
    details.more > summary { cursor: pointer; font-weight: 600; color: #57534E; list-style: none; padding: 4px 0; }
    details.more > summary::before { content: '▸ '; }
    details.more[open] > summary::before { content: '▾ '; }
    details.more[open] { display: grid; gap: 12px; }
    .card { border: 1px solid #E7E5E4; background: #FFF; border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; font-family: ui-monospace, Menlo, monospace; letter-spacing: .03em; }
    #pairStatus { font-weight: 600; }
    .ok { color: #16A34A; } .bad { color: #DC2626; }
    #saved { font-weight: 600; color: #57534E; }
    #saved.ok { color: #16A34A; }
    .check small { display: block; margin-top: 2px; }
    .check input { margin-top: 4px; accent-color: #BA583D; }
    label.inline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    label.inline select { min-width: 140px; }
    .savebar { position: sticky; bottom: 0; display: flex; justify-content: flex-end; align-items: center; gap: 14px;
      padding: 12px 0 16px; background: linear-gradient(to bottom, rgba(251,247,242,0), #FBF7F2 35%); }
    .savebar button { justify-self: auto; }
  </style>
</head>
<body>
  <main>
    <h1><img src="icons/icon128.png" alt=""> Hermes Chrome</h1>

    <section class="card">
      <div class="status" id="statusBox"><span class="dot"></span><div><b id="pairStatus">Not paired</b><small id="pairDetail"></small></div></div>
      <div id="updateNote" hidden></div>
      <div class="divider"></div>
      <label for="deviceName">Device name <small>How this browser shows up in /chrome devices.</small></label>
      <div class="row"><input id="deviceName" type="text" maxlength="60" spellcheck="false"><button id="saveName" class="quiet" type="button">Save name</button></div>
      <div id="pairBox">
        <label for="code">Pairing code <small>In Hermes, send <b>/chrome pair</b> (any chat) or run <b>hermes chrome pair</b>, then paste the code here. It looks like HC-7Q2K-9XPM@100.64.12.34:8798.</small></label>
        <div class="row"><input id="code" type="text" autocomplete="off" spellcheck="false" placeholder="HC-XXXX-XXXX@host:port"><button id="pair" type="button">Pair</button></div>
      </div>
      <div class="actions" id="pairedActions" hidden>
        <button id="repair" class="link" type="button">Pair with a different Hermes</button>
        <button id="unpair" class="danger" type="button">Unpair this browser</button>
      </div>
    </section>

    <section class="card">
      <label class="check"><input id="humanPace" type="checkbox"> <span>Human pace <small>Real mouse movement, one key at a time, short pauses.</small></span></label>
      <label class="check"><input id="confirmRisky" type="checkbox"> <span>Ask me before risky clicks <small>Pay, buy, delete, send, publish, post.</small></span></label>
      <label class="check"><input id="askNewSites" type="checkbox"> <span>Ask before acting on a new site <small>Decline, Allow once or Always allow, the first time it clicks or types on a site.</small></span></label>
    </section>

    <details class="more">
      <summary>More settings</summary>
      <section class="card">
        <label class="check"><input id="checkActions" type="checkbox"> <span>Check risky actions against my request <small>Your agent's own model checks risky clicks, submits and moves to other sites fit what you asked. Needs the Hermes plugin.</small></span></label>
        <label class="check"><input id="keepTabs" type="checkbox"> <span>Keep extra tabs open after a task <small>Off: extra tabs opened for side-by-side research close when the task ends.</small></span></label>
        <label class="check"><input id="showSteps" type="checkbox"> <span>Show each step in chat <small>Off: one live status line while the agent works.</small></span></label>
        <label class="inline">Tab group colour
          <select id="groupColor">
            <option>orange</option><option>blue</option><option>purple</option><option>green</option>
            <option>red</option><option>yellow</option><option>cyan</option><option>pink</option><option>grey</option>
          </select></label>
      </section>
      <section class="card">
        <label>Blocked sites <small>Never opened or touched. One per line. Starts with password-manager vaults.</small>
          <textarea id="blockedHosts" spellcheck="false"></textarea></label>
        <label>Ask me first <small>Every click, keystroke and submit waits for your OK. Starts with webmail, payments, banks and brokers.</small>
          <textarea id="watchHosts" spellcheck="false"></textarea></label>
        <label>Allowed to act on <small>Added when you press Always allow. Delete a line to take it back.</small>
          <textarea id="allowedHosts" spellcheck="false"></textarea></label>
      </section>
      <section class="card">
        <label class="check"><input id="allowEval" type="checkbox"> <span>Allow the agent to run JavaScript in pages <small>Powerful and risky. Never on "Ask me first" sites.</small></span></label>
      </section>
    </details>

    <div class="savebar"><span id="saved"></span><button id="save" type="button">Save changes</button></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
