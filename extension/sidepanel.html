<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Chrome</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #141210; --surface: #1E1B18; --raised: #2A2622; --line: #34302B; --hover: #26221F;
      --text: #EDE6DE; --muted: #9C928A; --faint: #6E655E;
      --accent: #C8664A; --accent-ink: #FFF6EE; --err: #F08A7A; --ok: #6FCF8E;
      --radius-lg: 22px; --radius: 12px; --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    @media (prefers-color-scheme: light) {
      :root { color-scheme: light;
        --canvas: #FBF8F4; --surface: #FFFFFF; --raised: #F1EAE2; --line: #E6DDD3; --hover: #F5EFE8;
        --text: #2A2420; --muted: #7A6F66; --faint: #A69B91;
        --accent: #BA583D; --accent-ink: #FFF8F2; --err: #C4402F; --ok: #2E9D58; --shadow: 0 10px 30px rgba(42,36,32,.12); }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--canvas); color: var(--text);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- header */
    header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 10px 8px 14px; }
    .who { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .who h1 { margin: 0; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
    .dot.on { background: var(--ok); }
    nav { display: flex; padding: 3px; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
    nav button { padding: 4px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--muted); transition: background .15s, color .15s; }
    nav button:hover { color: var(--text); }
    nav button[aria-selected="true"] { background: var(--raised); color: var(--text); }
    .tools { display: flex; justify-content: flex-end; align-items: center; gap: 2px; }
    .iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; color: var(--muted); }
    .iconbtn:hover { background: var(--hover); color: var(--text); }
    #pauseBtn { height: 28px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--raised); display: flex; align-items: center; gap: 5px; }
    #pauseBtn.paused { background: var(--accent); color: var(--accent-ink); }

    /* ---------- views */
    .view { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; }
    #log { padding-top: 12px; }

    /* empty state: the portrait is the one memorable thing */
    .empty { margin: auto 0; display: grid; justify-items: center; gap: 14px; text-align: center; color: var(--muted); padding: 24px 6px; }
    .empty .mark { width: 64px; height: 64px; border-radius: 50%; padding: 3px; background: conic-gradient(var(--accent) 0 72%, transparent 72%);
      animation: settle 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .empty .mark img { width: 100%; height: 100%; border-radius: 50%; display: block; border: 3px solid var(--canvas); background: var(--raised); }
    @keyframes settle { from { transform: rotate(-90deg) scale(.9); opacity: 0; } }
    .empty h2 { margin: 0; color: var(--text); font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
    .empty p { margin: 0; font-size: 13px; max-width: 30ch; }
    .suggest { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 360px; }
    .suggest button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; color: var(--text); }
    .suggest button:hover { background: var(--hover); }

    /* messages */
    .msg { max-width: 100%; overflow-wrap: anywhere; }
    .user { align-self: flex-end; max-width: 85%; background: var(--raised); padding: 9px 14px; border-radius: 18px; white-space: pre-wrap; }
    .user .att { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
    .assistant { line-height: 1.6; }
    .assistant a { color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 2px; }
    .assistant code { background: var(--raised); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
    .tool { align-self: flex-start; display: inline-flex; align-items: baseline; gap: 6px; max-width: 100%; font-size: 12.5px; color: var(--muted);
      padding: 2px 0; border-left: 2px solid var(--line); padding-left: 9px; }
    .tool span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tool + .tool { margin-top: -10px; } /* consecutive actions read as one group */
    .note { font-size: 12.5px; color: var(--muted); white-space: pre-wrap; }
    .update { margin: 8px 12px 0; padding: 10px 12px; border-radius: var(--radius); background: var(--raised); border: 1px solid var(--line);
      font-size: 12.5px; line-height: 1.45; }
    .update b { color: var(--text); }
    .update .acts { display: flex; gap: 8px; margin-top: 8px; }
    .update .acts button { padding: 5px 10px; border-radius: 8px; font-weight: 600; font-size: 12px; }
    .update .acts .primary { background: var(--accent); color: var(--accent-ink); }
    .update .acts .ghost { box-shadow: inset 0 0 0 1px var(--line); }
    .error { font-size: 13px; color: var(--err); }
    .working { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
    .working .ring { position: relative; width: 26px; height: 26px; flex: none; }
    .working .ring img { position: absolute; inset: 3px; width: 20px; height: 20px; border-radius: 50%; }
    .working .ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(var(--accent) 0 30%, transparent 30%); animation: spin 1s linear infinite;
      -webkit-mask: radial-gradient(circle, transparent 10px, #000 10.5px); mask: radial-gradient(circle, transparent 10px, #000 10.5px); }
    @keyframes spin { to { transform: rotate(1turn); } }

    /* ---------- composer */
    footer { position: relative; padding: 0 12px 12px; }
    footer.drop .box { border-color: var(--accent); }
    .box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 10px 10px 8px 14px;
      transition: border-color .15s; }
    .box:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
    #atts { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 8px; }
    #atts:empty { display: none; }
    .att-chip { display: flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 4px 3px 3px; border-radius: 10px; background: var(--raised); font-size: 12px; }
    .att-chip img, .att-chip .ico { width: 30px; height: 30px; border-radius: 7px; object-fit: cover; display: grid; place-items: center; background: var(--hover); }
    .att-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
    .att-chip button { color: var(--muted); padding: 0 5px; font-size: 15px; line-height: 1; }
    textarea { display: block; width: 100%; resize: none; min-height: 24px; max-height: 180px; padding: 2px 0 6px; border: 0; outline: 0;
      background: transparent; color: var(--text); font: inherit; font-size: 14.5px; }
    textarea::placeholder { color: var(--faint); }
    textarea:focus-visible { outline: none; } /* the composer border shows focus */
    .bar { display: flex; align-items: center; gap: 4px; }
    .chip { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; color: var(--muted); position: relative; }
    .chip:hover { background: var(--hover); color: var(--text); }
    #plusBtn { width: 30px; padding: 0; justify-content: center; }
    #tabChip input { position: absolute; opacity: 0; pointer-events: none; }
    #tabChip .sw { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
    #tabChip:has(input:checked) { color: var(--text); }
    #tabChip:has(input:checked) .sw { background: var(--accent); border-color: var(--accent); }
    #tabChip:has(input:focus-visible) { outline: 2px solid var(--accent); }
    .grow { flex: 1; }
    #modelChip { max-width: 55%; }
    #modelChip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #model { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
    #send { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink);
      transition: opacity .15s, transform .1s; }
    #send:active { transform: scale(.94); }
    #send.idle { opacity: .35; }
    #send.stop { background: var(--text); color: var(--canvas); }
    #send .i-stop { display: none; } #send.stop .i-send { display: none; } #send.stop .i-stop { display: block; }
    .i-stop { fill: currentColor; stroke: none; width: 12px; height: 12px; }

    /* popovers: + menu and / commands */
    .pop { position: absolute; left: 12px; right: 12px; bottom: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line);
      border-radius: 14px; box-shadow: var(--shadow); padding: 5px; max-height: 280px; overflow-y: auto; z-index: 5;
      animation: pop .14s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
    #plusMenu { right: auto; width: 230px; }
    .pop .mi { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; font-size: 13px; text-align: left; }
    .pop .mi:hover, .item.sel, .item:hover { background: var(--hover); }
    .pop .mi small { color: var(--muted); margin-left: auto; font-size: 11.5px; }
    .item { display: grid; padding: 7px 10px; border-radius: 9px; cursor: pointer; }
    .item b { font-size: 13px; font-weight: 600; }
    .item small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .kind { color: var(--accent); font-weight: 600; margin-left: 4px; }

    /* ---------- activity + teach */
    .runhead { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 6px; }
    .act { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; }
    .act img { width: 92px; height: 58px; object-fit: cover; object-position: top; border-radius: 9px; border: 1px solid var(--line); cursor: zoom-in; }
    .act .ph { width: 92px; height: 58px; border-radius: 9px; background: var(--surface); }
    .act b { display: block; font-size: 13px; font-weight: 500; }
    .act small { color: var(--muted); font-size: 11.5px; }
    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: grid; place-items: center; padding: 14px; cursor: zoom-out; z-index: 9; }
    #lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .big { justify-self: start; padding: 8px 15px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13px; }
    .big.stop { background: var(--err); color: #fff; }
    .big:disabled { opacity: .5; cursor: default; }
    .quietbtn { padding: 8px 13px; border-radius: 999px; background: var(--raised); font-size: 13px; }
    .steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; counter-reset: s; }
    .steps li { counter-increment: s; display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: start; font-size: 13px;
      padding: 8px 9px; border-radius: 10px; background: var(--raised); }
    .steps li::before { content: counter(s); color: var(--muted); font-size: 11.5px; font-weight: 600; padding-top: 1px; }
    .steps .var { grid-column: 2 / 4; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
    .steps .del { color: var(--muted); padding: 0 4px; font-size: 15px; }
    .field { display: grid; gap: 4px; font-size: 12.5px; font-weight: 600; }
    .field input { font: inherit; font-weight: 400; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--canvas); color: var(--text); }
    .rec-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--err); margin-right: 6px; animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: .3; } }

    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <div class="who"><span class="dot" id="dot" role="img" aria-label="Not connected"></span><h1 id="title">Hermes</h1></div>
    <nav role="tablist" aria-label="Views">
      <button role="tab" data-view="log" aria-selected="true" type="button">Chat</button>
      <button role="tab" data-view="activity" aria-selected="false" type="button">Activity</button>
      <button role="tab" data-view="teach" aria-selected="false" type="button">Teach</button>
    </nav>
    <div class="tools">
      <button id="pauseBtn" type="button" hidden>Pause</button>
      <button class="iconbtn" id="new" type="button"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span class="sr">New chat</span></button>
    </div>
  </header>

  <div id="update" class="update" role="status" hidden></div>
  <div id="log" class="view" aria-live="polite"></div>
  <div id="activity" class="view" hidden></div>
  <div id="teach" class="view" hidden></div>
  <div id="lightbox" hidden><img alt=""></div>

  <footer id="composer">
    <div id="menu" class="pop" role="listbox" hidden></div>
    <div id="plusMenu" class="pop" role="menu" hidden>
      <button class="mi" id="attach" role="menuitem" type="button"><svg viewBox="0 0 24 24"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7l8.5-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.3-2.3l7.9-7.9"/></svg>Upload files</button>
      <button class="mi" id="shot" role="menuitem" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3.2"/></svg>Screenshot this tab</button>
      <button class="mi" id="cmds" role="menuitem" type="button"><svg viewBox="0 0 24 24"><path d="m15 4-6 16"/></svg>Commands and skills<small>/</small></button>
    </div>
    <input id="file" type="file" multiple hidden>
    <div class="box">
      <div id="atts"></div>
      <textarea id="input" rows="1" placeholder="Ask your agent…"></textarea>
      <div class="bar">
        <button class="chip" id="plusBtn" type="button" aria-haspopup="menu"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="sr">Attach</span></button>
        <label class="chip" id="tabChip"><input id="useTab" type="checkbox" checked><span class="sw"></span>This tab</label>
        <span class="grow"></span>
        <span class="chip" id="modelChip"><span id="modelLabel">Default model</span><svg viewBox="0 0 24 24" style="width:14px;height:14px"><path d="m6 9 6 6 6-6"/></svg>
          <select id="model" aria-label="Model"><option value="">Default model</option></select></span>
        <button id="send" class="idle" type="button"><svg class="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg><svg class="i-stop" viewBox="0 0 12 12"><rect width="12" height="12" rx="2.5"/></svg><span class="sr" id="sendLabel">Send</span></button>
      </div>
    </div>
  </footer>
  <script src="sidepanel.js"></script>
</body>
</html>
