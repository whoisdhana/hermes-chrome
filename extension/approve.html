<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Chrome needs your OK</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #141210; --surface: #1E1B18; --line: #34302B; --text: #EDE6DE; --muted: #9C928A;
      --accent: #C8664A; --accent-ink: #FFF6EE;
    }
    @media (prefers-color-scheme: light) {
      :root { color-scheme: light; --canvas: #FBF8F4; --surface: #FFFFFF; --line: #E6DDD3; --text: #2A2420; --muted: #7A6F66;
        --accent: #BA583D; --accent-ink: #FFF8F2; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--canvas); color: var(--text); display: flex; flex-direction: column; justify-content: center;
      padding: 18px 20px; gap: 14px; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    .site { font-size: 12px; color: var(--muted); }
    .msg { font-size: 15px; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
    .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    button { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--surface); color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="site" id="site"></div>
  <div class="msg" id="msg">Loading…</div>
  <div class="acts" id="acts"></div>
  <script src="approve.js"></script>
</body>
</html>
