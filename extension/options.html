<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hermes Chrome settings</title>
  <style>
    body { margin: 0; font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; background: #FBF7F2; color: #1C1917; }
    main { max-width: 560px; margin: 40px auto; padding: 0 16px; display: grid; gap: 18px; }
    h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
    h1 img { width: 36px; height: 36px; }
    h2 { margin: 8px 0 0; font-size: 15px; }
    label { display: grid; gap: 4px; font-weight: 600; }
    small { font-weight: 400; color: #57534E; }
    input[type=text], textarea, select { font: inherit; padding: 8px 10px; border: 1px solid #D6D3D1; border-radius: 8px; background: #FFF; }
    textarea { min-height: 70px; }
    .check { display: flex; gap: 8px; align-items: flex-start; font-weight: 600; }
    button { justify-self: start; font: inherit; font-weight: 700; padding: 9px 18px; border: 0; border-radius: 8px; background: #BA583D; color: #FBF1E6; cursor: pointer; }
    button.quiet { background: #E7E5E4; }
    .card { border: 1px solid #E7E5E4; background: #FFF; border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; font-family: ui-monospace, Menlo, monospace; letter-spacing: .03em; }
    #pairStatus { font-weight: 600; }
    .ok { color: #16A34A; } .bad { color: #DC2626; }
    #saved { color: #16A34A; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1><img src="icons/icon128.png" alt=""> Hermes Chrome</h1>

    <section class="card">
      <div id="pairStatus">Not paired</div>
      <div id="updateNote" hidden></div>
      <label>Device name <small>How this browser shows up in /chrome devices.</small></label>
      <div class="row"><input id="deviceName" type="text" maxlength="60" spellcheck="false"><button id="saveName" class="quiet" type="button">Save name</button></div>
      <label>Pairing code <small>In Hermes, send <b>/chrome pair</b> (any chat) or run <b>hermes chrome pair</b>, then paste the code here. It looks like HC-7Q2K-9XPM@100.64.12.34:8798.</small></label>
      <div class="row"><input id="code" type="text" autocomplete="off" spellcheck="false" placeholder="HC-XXXX-XXXX@host:port"><button id="pair" type="button">Pair</button></div>
      <button id="unpair" class="quiet" type="button" hidden>Unpair this browser</button>
    </section>

    <h2>Behaviour</h2>
    <label>Tab group colour
      <select id="groupColor">
        <option>orange</option><option>blue</option><option>purple</option><option>green</option>
        <option>red</option><option>yellow</option><option>cyan</option><option>pink</option><option>grey</option>
      </select></label>
    <label>Blocked sites <small>The agent refuses to open or act on these hosts (and their subdomains). One per line, e.g. mybank.com. Starts with password-manager vaults.</small>
      <textarea id="blockedHosts"></textarea></label>
    <label class="check"><input id="checkActions" type="checkbox"> <span>Check risky actions against my request <small><br>Before a risky click, a form submit or sending data to a new site, your agent's own model checks it fits what you asked. If not, you see why and decide. Needs the Hermes plugin.</small></span></label>
    <label class="check"><input id="askNewSites" type="checkbox"> <span>Ask before acting on a new site <small><br>The agent can read any page, but its first click or keystroke on a site you have not approved asks: Decline, Allow once (this task) or Always allow.</small></span></label>
    <label>Sites it may act on <small>Added when you press Always allow. Delete a line to take the permission back.</small>
      <textarea id="allowedHosts"></textarea></label>
    <label>Ask me first on these sites <small>Every click, keystroke and form submit on these hosts waits for your OK. Starts with webmail, payment apps, banks and brokers. One per line.</small>
      <textarea id="watchHosts"></textarea></label>
    <label class="check"><input id="humanPace" type="checkbox"> <span>Human pace <small><br>Real mouse movement, one key at a time, short pauses. Slower, but sites react as they would to you.</small></span></label>
    <label class="check"><input id="keepTabs" type="checkbox"> <span>Keep extra tabs open after a task <small><br>The agent works in one tab and opens more only for side-by-side research. Off: it closes those extra tabs when the task ends.</small></span></label>
    <label class="check"><input id="showSteps" type="checkbox"> <span>Show each step in chat <small><br>List every browser action in the side-panel chat. Off: one live status line while the agent works (all steps stay in Activity).</small></span></label>
    <label class="check"><input id="confirmRisky" type="checkbox"> <span>Ask me before risky clicks <small><br>Pay, buy, delete, send, publish, post…</small></span></label>
    <label class="check"><input id="allowEval" type="checkbox"> <span>Allow the agent to run JavaScript in pages <small><br>Powerful and risky. Leave off unless you need it.</small></span></label>
    <button id="save" type="button">Save</button>
    <span id="saved"></span>
  </main>
  <script src="options.js"></script>
</body>
</html>
